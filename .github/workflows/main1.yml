name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create website
        run: |
          mkdir site
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Shatakshi's Java Project</title>
          </head>
          <body>
            <h1>Java Maven Project</h1>
            <h2>Successfully Deployed!</h2>
            <p>This website was deployed using GitHub Actions.</p>
            <p>Runner: GitHub-hosted Ubuntu</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
