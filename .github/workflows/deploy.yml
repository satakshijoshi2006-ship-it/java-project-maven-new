name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war


  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      - name: Check WAR file
        run: |
          echo "Files downloaded:"
          ls -lah

          WAR_FILE=$(find . -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          echo "WAR file found: $WAR_FILE"

      - name: Test Tomcat connection
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          echo "Testing Tomcat at $TOMCAT_HOST"

          curl -I --connect-timeout 10 \
            "http://$TOMCAT_HOST"

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |

          WAR_FILE=$(find . -name "*.war" | head -1)

          echo "Deploying: $WAR_FILE"
          echo "Tomcat: $TOMCAT_HOST"

          curl -v \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "http://$TOMCAT_HOST/manager/text/deploy?path=/myapp&update=true"

      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |

          echo "Checking application..."

          curl -f -I \
            --connect-timeout 10 \
            "http://$TOMCAT_HOST/myapp"

          echo "Deployment successful!"
